# Command Center — self-hosted stack
# Run: docker compose up -d
# By default this exposes port 3000 on the host. For production, DO NOT publish
# 3000 directly to the internet; instead put it behind an authenticating
# reverse proxy (Caddy/Traefik/nginx) with TLS, and pass through the real client
# IP via a trusted proxy header so rate limiting and the local-listener bypass
# stay correct.
services:
  command-center:
    build: .
    image: command-center:local
    container_name: command-center
    restart: unless-stopped
    environment:
      # First run: set a strong operator password via the setup screen
      # (loopback-only by default). DEMO_MODE=false in production.
      - DEMO_MODE=false
      # Optional: enable the no-key loopback API listener for local automation.
      - LOCAL_API_ENABLED=false
      # - LOCAL_API_PORT=3001
      # Weather widget (wttr.in) location
      - WEATHER_LOCATION=Kingston,Ontario,Canada
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
